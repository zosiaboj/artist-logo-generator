# Generic deployment. Site-specific wiring (reverse proxy labels, external
# networks, on-demand start, ...) goes in a compose.override.yaml next to this
# file, which `docker compose` merges automatically. See
# compose.override.example.yaml.
services:
  plex-artist-logos:
    build:
      context: ./Docker
      args:
        # rembg (~1GB) is only installed when background removal is enabled.
        # Changing REMBG_ENABLED needs a rebuild: docker compose up -d --build
        INSTALL_REMBG: ${REMBG_ENABLED:-false}
    hostname: plex-artist-logos
    ports:
      - "5005:5000"
    environment:
      - PLEX_URL=${PLEX_URL:-http://your-ip:32400}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - LIBRARY_NAME=Music
      - FANART_API_KEY=${FANART_API_KEY}
      - UPDATE_PLEX=${UPDATE_PLEX:-true}
      - REMBG_ENABLED=${REMBG_ENABLED:-false}
      - U2NET_HOME=/app/rembg_models
    volumes:
      - ./Docker/fonts.txt:/app/fonts.txt
      - fonts:/app/fonts
      - data:/app/ArtistLogos
      - logs:/app/Logs
      - rembg_models:/app/rembg_models
    restart: unless-stopped
    # tini as PID 1: python/waitress ignore SIGTERM as PID 1, so `docker stop` (and Sablier's
    # idle stop) otherwise waits 10s and SIGKILLs (exit 137). With init it stops in <1s.
    init: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 3g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  fonts:
  data:
  logs:
  rembg_models:
